{% extends "base.html" %}
{% block title %}Error – METAR Weather{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 text-center py-5">
    <i class="bi bi-exclamation-triangle display-1 text-danger"></i>
    <h2 class="mt-3 fw-bold">Something went wrong</h2>
    <p class="text-muted">
      {% if icao %}Could not retrieve METAR for <strong>{{ icao }}</strong>.{% endif %}
    </p>
    <div class="alert alert-secondary font-monospace small text-start">{{ error }}</div>
    <a href="/" class="btn btn-warning fw-bold mt-2">
      <i class="bi bi-arrow-left me-1"></i>Try Another Airport
    </a>
  </div>
</div>
{% endblock %}
