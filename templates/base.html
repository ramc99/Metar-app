<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}METAR Weather{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" href="/">
      <i class="bi bi-cloud-sun-fill me-2 text-warning"></i>METAR Weather
    </a>
    <form class="d-flex gap-2" action="/search" method="get">
      <input class="form-control form-control-sm" type="text" name="icao"
             placeholder="ICAO code (e.g. KJFK)" maxlength="4" style="width:180px;" />
      <button class="btn btn-warning btn-sm fw-bold" type="submit">Search</button>
    </form>
  </nav>

  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>

  <footer class="text-center text-muted py-3 border-top small">
    Data sourced from <a href="https://www.noaa.gov/" target="_blank">NOAA</a> &mdash;
    METAR Weather App &copy; 2025
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
